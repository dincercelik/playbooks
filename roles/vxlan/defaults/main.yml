---
vxlan_underlay_iface: "{{ ansible_facts['default_ipv4']['interface'] }}"
vxlan_underlay_ip: "{{ ansible_facts['default_ipv4']['address'] }}"

vxlan_port: 4789

vxlan_ids:
  - 10010
  - 10020
  - 10030

vxlan_overlay_ips:
  host1:
    "10010": "10.10.10.1/24"
    "10020": "10.10.20.1/24"
    "10030": "10.10.30.1/24"
  host2:
    "10010": "10.10.10.2/24"
    "10020": "10.10.20.2/24"
    "10030": "10.10.30.2/24"
  host3:
    "10010": "10.10.10.3/24"
    "10020": "10.10.20.3/24"
    "10030": "10.10.30.3/24"

vxlan_remote_vteps: >-
  {{
    (groups['vxlan'] | default([]))
    | reject('equalto', inventory_hostname)
    | map('extract', hostvars)
    | selectattr('ansible_facts.default_ipv4.address', 'defined')
    | map(attribute='ansible_facts.default_ipv4.address')
    | list
  }}

vxlan_netplan_file: /etc/netplan/50-vxlan.yaml
