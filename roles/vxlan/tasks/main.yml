---
- name: Ensure required packages are installed
  ansible.builtin.apt:
    name:
      - iproute2
      - bridge-utils
      - netplan.io
    update_cache: true
    state: present

- name: Render VXLAN Netplan configuration
  ansible.builtin.template:
    src: netplan.yaml.j2
    dest: "{{ vxlan_netplan_file }}"
    mode: "0644"
    owner: root
    group: root
  notify:
    - Apply netplan configuration
    - Restart vxlan-fdb service

- name: Render VXLAN FDB script
  ansible.builtin.template:
    src: vxlan-fdb.sh.j2
    dest: /usr/local/bin/vxlan-fdb.sh
    mode: "0755"
    owner: root
    group: root
  notify: Restart vxlan-fdb service

- name: Install VXLAN FDB systemd unit
  ansible.builtin.template:
    src: vxlan-fdb.service.j2
    dest: /etc/systemd/system/vxlan-fdb.service
    mode: "0644"
    owner: root
    group: root
  notify:
    - Reload systemd
    - Restart vxlan-fdb service

- name: Apply pending VXLAN configuration handlers
  ansible.builtin.meta: flush_handlers

- name: Enable and start VXLAN FDB service
  ansible.builtin.systemd:
    name: vxlan-fdb.service
    enabled: true
    state: started
